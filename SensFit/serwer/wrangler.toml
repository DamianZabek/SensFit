# SensFit access server (Cloudflare Workers, free plan)
name = "sensfit-dostep"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
DISCORD_CLIENT_ID = "ID"
GUILD_ID = "ID"     # SensFit Discord server
ROLE_ID = "ID"      # tester role
WAZNOSC_GODZ = "72"                  # hours a ticket stays valid without internet
MAX_KOMPUTEROW = "2"                 # computers allowed per Discord account

# Account storage (Discord tokens and the list of computers). The ID comes from:
#   npx wrangler kv namespace create KONTA
[[kv_namespaces]]
binding = "KONTA"
id = "ID"   # sensfit-konta

# Secrets (do NOT put them here), set with these commands:
#   npx wrangler secret put DISCORD_CLIENT_SECRET
#   npx wrangler secret put KLUCZ_PRYWATNY      (the "KLUCZ_PRYWATNY" line printed by klucze.py)
